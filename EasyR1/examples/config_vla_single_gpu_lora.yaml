data:
  train_files: ""
  val_files: ""
  prompt_key: problem
  answer_key: answer
  image_key: images
  image_dir: null
  max_prompt_length: 3072
  max_response_length: 1536
  rollout_batch_size: 4
  mini_rollout_batch_size: 4
  val_batch_size: 4
  format_prompt: null
  shuffle: true
  seed: 20260812
  min_pixels: 65536
  max_pixels: 262144
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 1
  token_filter_file: null

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: false

worker:
  actor:
    global_batch_size: 4
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    padding_free: true
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: null
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
      lora:
        rank: 8
        alpha: 16
        target_modules: q_proj,k_proj,v_proj,o_proj
        exclude_modules: .*visual.*
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: false
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    n: 2
    temperature: 1.0
    top_p: 1.0
    limit_images: 1
    gpu_memory_utilization: 0.55
    enforce_eager: true
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    max_num_batched_tokens: 4608
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: true

  reward:
    reward_function: ./verl/utils/reward_score/navsim/navsim_reward_text.py:compute_score_fast

trainer:
  total_epochs: 1
  max_steps: 5
  project_name: failure_aware_safety_grpo
  experiment_name: single_gpu_lora_smoke
  logger: ["file", "tensorboard"]
  nnodes: 1
  n_gpus_per_node: 1
  max_try_make_batch: 20
  val_freq: -1
  val_before_train: false
  val_only: false
  val_generations_to_log: 0
  save_freq: -1
  save_limit: 1
  save_model_only: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  find_last_checkpoint: false
